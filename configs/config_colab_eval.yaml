# Colab evaluation config — uses local disk paths (same as training config)
# Cell 4 extracts archives to /content/lyrevoice_data/ — reuse that, no extra extraction needed
# Only results are saved to Drive so they persist
# Usage: python scripts/evaluate.py --config configs/config.yaml --config-override configs/config_colab_eval.yaml

data:
  vctk_path: /content/lyrevoice_data/datasets/VCTK-Corpus
  preprocessed_path: /content/lyrevoice_data/preprocessed

vocoder:
  checkpoint: /content/lyrevoice_data/pretrained/hifigan_generator.pt
  config: /content/lyrevoice_data/pretrained/hifigan_config.json

generator:
  tacotron2_checkpoint: /content/lyrevoice_data/pretrained/tacotron2_statedict.pt

evaluation:
  output_dir: /content/drive/MyDrive/lyrevoice/eval_outputs
